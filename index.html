<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Página de Login</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      background: linear-gradient(135deg, #0f0f0f, #1a1a1a);
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      color: #e5e7eb;
    }

    .container {
      width: 100%;
      max-width: 400px;
      padding: 30px;
      border: 1px solid #3f3f46;
      border-radius: 15px;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.6);
      background: #111;
    }

    .logo {
      display: flex;
      justify-content: center;
      margin-bottom: 20px;
    }

    .logo img {
      width: 90px;
      height: 90px;
      border-radius: 50%;
      border: 2px solid #4b5563;
    }

    h1 {
      text-align: center;
      color: #f3f4f6;
      font-size: 24px;
      margin-bottom: 20px;
    }

    label {
      display: block;
      font-size: 14px;
      color: #d1d5db;
      margin-bottom: 5px;
    }

    input[type="email"],
    input[type="password"] {
      width: 100%;
      padding: 10px;
      border: 1px solid #3f3f46;
      border-radius: 8px;
      background: #1f1f1f;
      color: #f3f4f6;
      outline: none;
      margin-bottom: 15px;
      transition: 0.3s;
    }

    input:focus {
      border-color: #9ca3af;
      box-shadow: 0 0 6px #6b7280;
    }

    button {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 8px;
      background: linear-gradient(135deg, #1f2937, #374151);
      color: #fff;
      font-size: 16px;
      cursor: pointer;
      transition: transform 0.2s, background 0.3s;
    }

    button:hover {
      background: linear-gradient(135deg, #374151, #4b5563);
      transform: scale(1.03);
    }

    p {
      text-align: center;
      margin-top: 15px;
      font-size: 13px;
      color: #9ca3af;
    }

    p a {
      color: #d1d5db;
      text-decoration: none;
    }

    p a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="logo">
      <img src="sources/images/imagem-empresa.jpeg" alt="Logo Empresa">
    </div>
    <h1>Login</h1>
    <form id="formLogin">
      <label for="email">E-mail</label>
      <input type="email" id="email" name="email" placeholder="Digite seu e-mail" required>

      <label for="senha">Senha</label>
      <input type="password" id="senha" name="senha" placeholder="Digite sua senha" required>

      <button type="submit">Entrar</button>
    </form>
    <p>Esqueceu sua senha? <a href="#">Recuperar</a></p>
  </div>

  <script>
    const form = document.getElementById("formLogin");
    form.addEventListener("submit", function(e) {
      e.preventDefault();
      const email = document.getElementById("email").value;
      const senha = document.getElementById("senha").value;

      if(email === "admin@empresa.com" && senha === "12345") {
        alert("Login realizado com sucesso!");
      } else {
        alert("E-mail ou senha incorretos!");
      }
    });
  </script>
</body>
</html>
